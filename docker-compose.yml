services:
  frontend:
    build: ./frontend
    ports:
      - '8080:80' # jedyny port opublikowany na hoście
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    read_only: true # system plików kontenera tylko do odczytu
    cap_drop:
      - ALL # odebranie wszystkich uprawnień jądra (capabilities)
    security_opt:
      - no-new-privileges:true # proces nie może zyskać uprawnień (np. przez setuid)
    tmpfs:
      - /tmp
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data/leaked-sha1.txt:/data/leaked-sha1.txt:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
